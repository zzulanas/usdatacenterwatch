# Notes on the numbers above:
#   - total_mw: 2,000 = the initial compute capacity Meta has publicly committed
#     to ("over 2 GW" per Meta's own page); the campus is designed to scale to
#     ~5 GW over several years (cited as the upper bound in Sherwood + IEEE
#     Spectrum), but we model only the disclosed-and-built initial phase.
#   - construction_capex_usd: $27B = the Meta + Blue Owl Capital financing
#     closed in October 2025. Initial Meta-only commitment was $10B; the $27B
#     figure is the full project value with Blue Owl's stake.
#   - year_built: 2028 is the planned first-phase opening per Meta's page.
#     The status remains `under_construction` (broke ground December 2024).
# Fields intentionally omitted because no public source asserts the value:
#   it_load_mw, design_pue (Meta has not disclosed effective PUE for Hyperion;
#     total_mw above is the public "compute capacity" figure)
#   cooling_type (the campus is being powered by 5.2 GW of new natural gas
#     and uses liquid cooling per IEEE Spectrum, but we don't have a clean
#     primary citation for the cooling design yet)
#   water_source, power_sources, reported_annual_mwh (not operational yet)
#   jobs_construction, jobs_permanent (not finalized in public materials)
