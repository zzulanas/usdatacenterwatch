# it_load_mw is conservative. Meta's 2022 environmental data disclosed
# 504,049 MWh of annual electricity for Eagle Mountain. Back-calculated
# with default assumptions (PUE 1.10, utilization 0.6, 8760 hr/yr):
#   87 MW = 504,049 MWh / 8760 / 1.10 / 0.6
# Caveat: the campus has expanded significantly since 2022 (the info-sheet
# now lists 300 MW total nameplate; see total_mw above). The 87 MW figure
# is the LOWER bound based on most recent publicly disclosed annual MWh
# and will under-state current load. The 300 MW total_mw is the upper bound
# (total facility, including PUE losses). Real IT load sits between.
# Confidence: medium given the staleness + the gap between disclosed and
# nameplate. A 2024 MWh disclosure would tighten this considerably.
it_load_mw: 87
