# Notes:
#   - This is the former Foxconn manufacturing site Microsoft repurposed for
#     AI infrastructure. Original Foxconn $10B plant promise collapsed; Microsoft
#     took over the land and is building a hyperscale campus on it.
#   - construction_capex_usd: $7.3B = $3.3B initial commitment + $4B for the
#     second-phase data center announced September 2025. The two figures are
#     cumulative across the same campus, not separate sites.
#   - sqft: 15 buildings approved (9 × ~580,000 sqft and 6 × ~568,000 sqft per
#     CNBC's coverage of the January 2026 board approval) = ~8.6M sqft when
#     fully built. We omit sqft until first phase comes online to avoid
#     overstating current scale.
#   - status: under_construction. Microsoft paused some Wisconsin construction
#     in January 2025 then resumed/expanded in September 2025 with the second
#     $4B announcement. First DC scheduled to open early 2026.
# Fields intentionally omitted because no public source asserts the value:
#   it_load_mw, total_mw, design_pue (Microsoft does not publish per-site IT load)
#   sqft (15 approved buildings = ~8.6M sqft total; this number reflects future
#     buildout, not current operational footprint)
#   cooling_type, water_source (not in public materials for this site)
#   address (no specific street address published; site is east of I-94 south
#     of State Highway 11 per CNBC)
