# Notes:
#   - operator: this is a joint venture between OpenAI, Oracle, and SoftBank
#     announced under the "Stargate" umbrella in January 2025. Oracle Cloud
#     Infrastructure runs the actual compute; OpenAI is the primary tenant.
#     Using "OpenAI / Oracle / SoftBank" as the operator string is honest
#     about the multi-party structure rather than picking one party.
#   - status: under_construction. As of late 2025 Oracle has delivered the
#     first Nvidia GB200 racks and parts of the campus are operational, but
#     the full 8-building build is not complete.
#   - total_mw: ~1,200 MW. The 7 GW figure cited in OpenAI's announcement
#     covers the combined Stargate program (Abilene + 5 new sites + CoreWeave
#     partnerships), not just Abilene. The Abilene flagship is one of several
#     sites and proportionally accounts for ~1.2 GW.
