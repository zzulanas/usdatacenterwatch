slug: apple-maiden-nc
name: Maiden Data Center Campus
operator: Apple
tenant_type: hyperscaler
status: operational
location:
  lng: -81.2070
  lat: 35.5755
city: Maiden
county: Catawba
state: NC
fips: "37035"
acres: 465
sqft: 1000000
year_built: 2010
# it_load_mw is derived from reported_annual_mwh below using Apple's
# published global-average PUE (1.06) and default utilization 0.6:
#   ~81 MW = 453,000 / 8760 / 1.06 / 0.6  → rounded to 80
# Consistent with older DCK reporting ("about 40 MW at full capacity")
# which described the original single building before the campus grew
# to 6 buildings. scripts/validate-model.ts round-trips this.
it_load_mw: 80
design_pue: 1.06
# DCD reported Apple's Maiden NC data center used 453,000,000 kWh
# (453 GWh) of electricity in 2023. Calibration anchor.
reported_annual_mwh: 453000
construction_capex_usd: 4000000000
# Fields intentionally omitted because no public source asserts the value:
#   total_mw (Apple does not publish per-site nameplate capacity)
#   address (the widely cited "5977 Startown Rd" was traced only to
#     datacenters.com, a tertiary aggregator — per the README sourcing rules,
#     address may not derive solely from an aggregator chain. Re-add when a
#     Catawba County parcel record or Apple-published address can be cited.)
#   cooling_type, water_source (not in Apple's public materials for Maiden)
#   jobs_construction, jobs_permanent (per-site headcount not disclosed)
# Note on construction_capex_usd: $4B is Catawba Economic Development
# Corporation's stated cumulative investment figure at the Maiden site
# (corroborated by Hickory Record's local coverage of the 2021 $448M
# tranche). Not a single-build capex.
# Note on power_sources: Apple operates three adjacent 100-acre / ~20 MW solar
# arrays plus a 10 MW fuel cell installation at this site (see 9to5mac and
# datacenters.com sources), but the share of facility load served by these
# is not published cleanly enough to populate power_sources without inference.
confidence: medium
