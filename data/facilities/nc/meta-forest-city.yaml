#   address (no public street address found in Meta's info-sheet or Rutherford
#     County GIS during curation)
#   cooling_type (Meta's indirect-evaporative design is documented at the
#     program level — DCK's "Facebook's new cooling design" article — but no
#     per-site Forest City citation traced; remove rather than assert by
#     inference from program-level reporting)
#   jobs_construction, jobs_permanent, power_sources (per-site headcount + grid
