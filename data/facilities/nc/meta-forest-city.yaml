# construction_capex_usd here is Meta's disclosed cumulative investment in the
# Forest City campus over ~14 years (NOT a single-build capex). Treated as the
# best available capital-investment number per the info-sheet language.
construction_capex_usd: 750000000
# Fields intentionally omitted because no public source asserts the value:
