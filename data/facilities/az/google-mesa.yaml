# Notes:
#   - status: under_construction. Phase 1 (288,530 sqft) was projected to go
#     live July 2025. Subsequent phases tied to milestones in 2027 and 2029,
#     with the full 750,000 sqft buildout by 2030.
#   - cooling_type: air. Google explicitly chose air cooling for Mesa because
#     of Arizona's water scarcity; cited in multiple primary sources.
#   - construction_capex_usd: original announcement was $600M; the buildout
#     contract has since exceeded $1B per construction-dive and the milestone
#     framework requires a minimum $1B spend by 2029. Using the $1B figure.
# Fields intentionally omitted because no public source asserts the value:
#   it_load_mw, total_mw, design_pue (Google does not publish per-site IT load;
#     the 430 MW renewable PPA figure is procurement-side, not facility load)
#   water_source (air-cooled, so water draw is minimal — not the dominant
#     story for this site)
#   jobs_construction, jobs_permanent (not consistently published)
