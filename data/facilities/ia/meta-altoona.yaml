# it_load_mw is derived from reported_annual_mwh below using the modeling
# pipeline's default assumptions (PUE 1.10, utilization 0.6, 8760 hr/yr):
#   215 MW = 1,243,306 MWh / 8760 / 1.10 / 0.6
# Round-trip: feeding it_load_mw=215 through estimates.ts reproduces the
# disclosed 1.24 TWh/yr exactly. scripts/validate-model.ts asserts this.
it_load_mw: 215
design_pue: 1.10
# Meta's 2024 sustainability report disclosed annual electricity for this
# campus (second-largest among Meta's owned facilities). Used as a
# calibration anchor for the model — not a model input.
reported_annual_mwh: 1243306
reported_annual_mwh_year: 2024
construction_capex_usd: 2500000000
jobs_permanent: 400
# Fields intentionally omitted because no public source asserts the value:
#   total_mw (Meta publishes annual MWh and PUE but not nameplate capacity)
#   jobs_construction (cumulative figure published — see source — but expressed as
#     "average of 1,000 workers on-site for 12 years", not a single number)
#   address (the commonly cited "1601 NE 60th St" was not traced to a primary
#     source during curation — add when a Polk County parcel/permit citation
#     can be attached)
#   cooling_type (Meta info-sheet for Altoona does not disclose cooling type
#     in the public materials I could read)
#   water_source, power_sources (per-site grid mix not disclosed)
confidence: medium
